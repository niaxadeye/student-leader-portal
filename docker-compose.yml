# Только PostgreSQL. Go api/worker запускаются нативно (PM2/systemd),
# файлы хранятся во внешнем S3.
# Все порты слушают на 127.0.0.1 — наружу закрыто, доступ только с localhost.
services:
  postgres:
    image: postgres:16-alpine
    container_name: slc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_leader}
      POSTGRES_USER: ${POSTGRES_USER:-student_leader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      # Хост 5433 → контейнер 5432: системный PostgreSQL уже занимает 5432.
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-student_leader}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
